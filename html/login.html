<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - TicketPerú</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <header>
    <h1>TicketPerú</h1>
    <p><em>Registro e inicio de sesión</em></p>
    <nav>
      <a href="../index.html">Inicio</a>
    </nav>
  </header>

  <main>
    <h2>Crear cuenta</h2>
    <form id="formRegistro">
      <label>Nombre completo:
        <input type="text" id="nombre" required>
      </label>
      <label>Correo electrónico:
        <input type="email" id="correo" required>
      </label>
      <label>Contraseña:
        <input type="password" id="contrasena" required>
      </label>
      <button type="submit">Registrarse</button>
    </form>

    <hr class="separador">

    <h2>Iniciar sesión</h2>
    <form id="formLogin">
      <label>Correo electrónico:
        <input type="email" id="correoLogin" required>
      </label>
      <label>Contraseña:
        <input type="password" id="contrasenaLogin" required>
      </label>
      <button type="submit">Ingresar</button>
    </form>

    <!-- Mensaje con animación -->
    <div id="mensaje-registro"></div>
  </main>

  <footer>
    <p>&copy; 2026 TicketPerú</p>
  </footer>

  <!-- Script de autenticación -->
  <script type="module" src="../js/auth/auth.js"></script>
</body>
</html>
